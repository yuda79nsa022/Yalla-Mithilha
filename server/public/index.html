<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bas Bedoon Kalam — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Noto+Kufi+Arabic:wght@400;500;700;900&display=swap" />
<style>
  /* The player app's own design system (src/ui/theme.ts + components), so
     both portals look like one product:
     - same tokens: ink rules, square corners, hard offset shadows, purple primary
     - same header: logo + app name on the start side, the sections as
       icon + label tabs (active = solid purple), the account, a red log-out
       icon and the AR/EN toggle on the end side; same copyright footer
     - same buttons: 56px tall, 17px bold label; primary purple with the ink
       shadow, secondary outlined, danger red outline. Small ones only inside
       table and title rows.
     - same placement rule: every card's actions sit in its bottom bar on the
       end side — bottom-right in English, bottom-left in Arabic — primary
       outermost, secondary/danger beside it. Dialogs too.
     - same direction rule: Arabic is laid out right-to-left (dir="rtl"), and
       the hard shadows fall to the left, as in the player app. Everything
       below uses logical sides (start/end), so it mirrors on its own. */
  :root {
    color-scheme: light;
    --ink: #201E1D; --ground: #F3F2F2; --white: #FFFFFF;
    --purple: #8038D1; --purple700: #6928B0; --purpleTop: #A473EE; --purpleSide: #591F97;
    --green: #6FDB55; --red: #EC3013;
    --muted-bg: #E4E2E2; --muted-text: #8A8583; --neutral700: #5B5654;
    --overlay: rgba(32, 30, 29, 0.72);
    --column: 1100px;
    --font: 'Noto Kufi Arabic', system-ui, sans-serif;
    --display: 'Archivo', 'Noto Kufi Arabic', system-ui, sans-serif;
    --dx: 1;   /* shadow direction: right in English … */
  }
  [dir="rtl"] { --dx: -1; }   /* … left in Arabic */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font); font-weight: 500; background: var(--ground); color: var(--ink);
    font-size: 15px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column;
  }
  .hidden { display: none !important; }

  /* ---- header: the player app's site bar */
  /* Like the player app's bar: full width with a rule under it, its contents
     lined up with the page column below. */
  header.site { border-bottom: 2px solid var(--muted-bg); }
  header.site .bar { max-width: var(--column); margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--purple); min-width: 0; }
  /* A logo picture keeps its own proportions, 52px tall — the player header's. */
  .brand img { height: 52px; width: auto; max-width: 220px; object-fit: contain; display: block; }
  .brandName { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .brandTag { font-family: var(--display); font-size: 11px; letter-spacing: 1.5px; color: var(--white); background: var(--ink); padding: 2px 8px; transform: rotate(-2deg); }
  [dir="rtl"] .brandTag { letter-spacing: 0; }
  .cubeWrap { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; perspective: 800px; }
  .cube { width: 24px; height: 24px; position: relative; transform-style: preserve-3d; transform: rotateX(-22deg) rotateY(-32deg); }
  .cube span { position: absolute; inset: 0; }
  .cube .front { background: var(--purple); transform: translateZ(12px); }
  .cube .front::before { content: ''; position: absolute; left: 22%; right: 22%; top: 36%; height: 2px; background: var(--white); }
  .cube .front::after { content: ''; position: absolute; left: 18%; right: 18%; bottom: 24%; height: 3px; background: var(--ink); }
  .cube .side { background: var(--purpleSide); transform: rotateY(90deg) translateZ(12px); }
  .cube .top { background: var(--purpleTop); transform: rotateX(90deg) translateZ(12px); }

  nav#mainNav { display: flex; gap: 8px; flex-wrap: wrap; }
  .navTab {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px;
    border: 2px solid transparent; background: transparent; color: var(--ink);
    font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .navTab:hover { border-color: var(--ink); }
  .navTab.active { background: var(--purple); border-color: var(--purple); color: var(--white); }
  .navTab svg, .iconBtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .headerEnd { display: flex; align-items: center; gap: 12px; }
  .account { display: flex; align-items: center; gap: 12px; }
  /* Every header control — tabs, account, log out, language — is 40px tall. */
  .chip { height: 40px; display: inline-flex; align-items: center; border: 2px solid var(--ink); padding: 0 12px; font-weight: 700; font-size: 13px; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconBtn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid transparent; background: transparent; cursor: pointer; color: var(--red); padding: 0; }
  .iconBtn:hover { border-color: var(--red); }
  [dir="rtl"] .iconBtn svg { transform: scaleX(-1); }
  /* The player app's AR/EN switch: names the language it switches to. */
  .langToggle { height: 40px; font-family: var(--display); font-size: 13px; letter-spacing: 1px; color: var(--purple); background: transparent; border: 2px solid var(--ink); padding: 0 12px; cursor: pointer; }
  .langToggle:hover { background: var(--ink); color: var(--white); }

  /* ---- footer: the player app's copyright line */
  footer.site { margin-top: auto; padding: 8px 20px 12px; text-align: center; font-size: 11px; color: var(--muted-text); }

  main { width: 100%; max-width: var(--column); margin: 8px auto 0; padding: 0 20px 48px; }

  /* ---- page title + cards */
  .pageHead { margin: 16px 0 20px; }
  .pageHead h1 { font-size: 30px; line-height: 1.3; font-weight: 900; margin: 0; }
  .pageHead p { margin: 4px 0 0; color: var(--neutral700); font-size: 14px; }
  .card { background: var(--white); border: 2px solid var(--ink); padding: 24px; margin-bottom: 24px; }
  .card h2 { font-size: 22px; line-height: 1.4; font-weight: 700; margin: 0 0 4px; }
  .card > p.lead { margin: 0 0 16px; color: var(--neutral700); font-size: 14px; }
  .gate { max-width: 480px; margin: 48px auto; }
  a.back { color: var(--purple700); font-weight: 700; font-size: 14px; cursor: pointer; display: inline-block; margin: 16px 0 0; border-bottom: 2px solid var(--purple700); text-decoration: none; }

  /* ---- buttons: one look, the player app's */
  .btn {
    cursor: pointer; font: inherit; font-weight: 700; font-size: 17px; line-height: 1.2;
    min-height: 56px; min-width: 128px; padding: 12px 24px; border-radius: 0;
    border: 2px solid var(--ink); background: var(--purple); color: var(--white);
    box-shadow: calc(6px * var(--dx)) 6px 0 var(--ink); transition: transform 60ms, box-shadow 60ms;
  }
  .btn:active:not(:disabled) { transform: translate(calc(3px * var(--dx)), 3px); box-shadow: calc(3px * var(--dx)) 3px 0 var(--ink); }
  .btn.secondary { background: transparent; color: var(--ink); box-shadow: none; }
  .btn.danger { background: transparent; color: var(--red); border-color: var(--red); box-shadow: none; }
  .btn.secondary:hover:not(:disabled) { background: var(--muted-bg); }
  .btn.danger:hover:not(:disabled) { background: #FDEBE8; }
  .btn:disabled { background: var(--muted-bg); color: var(--muted-text); border-color: var(--muted-text); box-shadow: none; cursor: default; }
  /* Small: only the per-row controls inside a table or the title list. */
  .btn.sm { min-height: 36px; min-width: 0; padding: 4px 12px; font-size: 14px; box-shadow: calc(3px * var(--dx)) 3px 0 var(--ink); }
  .btn.sm.secondary, .btn.sm.danger { box-shadow: none; }

  /* ---- the action bar: bottom of every card and dialog, end side */
  .actions { display: flex; gap: 12px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-top: 24px; padding-top: 16px; border-top: 2px solid var(--muted-bg); }
  .actions.withPager { justify-content: space-between; }
  .actions .end { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; margin-inline-start: auto; }
  .result { margin: 12px 0 0; font-size: 14px; font-weight: 700; color: var(--purple); }
  .result.error { color: var(--red); }
  .result:empty { display: none; }

  /* ---- fields: the player app's Field */
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  input, select, textarea {
    font: inherit; font-size: 16px; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 0;
    width: 100%; background: var(--white); color: var(--ink); min-height: 56px;
  }
  textarea { min-height: 120px; resize: vertical; }
  input[type="file"] { min-height: 0; padding: 12px; font-size: 14px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--purple); box-shadow: calc(3px * var(--dx)) 3px 0 var(--purple); }
  .field { margin-bottom: 16px; }
  .hint { margin: 6px 0 0; font-size: 12px; color: var(--neutral700); }
  .row { display: flex; gap: 16px; }
  .row > * { flex: 1; min-width: 0; }
  .imageField { display: flex; align-items: center; gap: 12px; }
  .imageField img { width: 56px; height: 56px; object-fit: contain; background: var(--muted-bg); border: 2px solid var(--ink); flex: 0 0 auto; }

  /* ---- list toolbar, table, pager */
  .toolbar { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar .search { flex: 1; min-width: 220px; }
  .toolbar .size { width: 140px; }
  .tableWrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: start; padding: 10px 12px; border-bottom: 2px solid var(--muted-bg); font-size: 14px; vertical-align: middle; }
  th { font-size: 13px; color: var(--neutral700); font-weight: 700; white-space: nowrap; border-bottom-color: var(--ink); }
  th button.sort { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  th button.sort:hover { color: var(--purple700); }
  th button.sort .arrow { font-size: 11px; color: var(--muted-text); }
  th button.sort.on { color: var(--ink); }
  th button.sort.on .arrow { color: var(--purple); }
  td.rowActions { white-space: nowrap; text-align: end; }
  td.rowActions .btn { margin-inline-start: 8px; }
  td.muted, .muted { color: var(--neutral700); }
  td.empty { text-align: center; color: var(--neutral700); padding: 24px; }
  .pager { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--neutral700); flex-wrap: wrap; }
  .pager .btn.sm { min-width: 44px; }
  .badge { display: inline-block; border: 2px solid var(--ink); padding: 0 8px; font-size: 12px; font-weight: 700; }
  .badge.en { border-color: var(--purple); color: var(--purple); }

  /* ---- a title's row in the deck editor */
  .titleRow { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 2px solid var(--muted-bg); flex-wrap: wrap; }
  .titleRow img { width: 40px; height: 40px; object-fit: cover; background: var(--muted-bg); flex: 0 0 auto; }
  .titleRow input[data-title-text] { flex: 1; min-width: 160px; min-height: 40px; padding: 6px 10px; }
  .titleRow select { width: 140px; min-height: 40px; padding: 6px 10px; font-size: 14px; }
  .titleRow input[type="file"] { width: 190px; font-size: 12px; padding: 6px; }
  .titleRow .rowEnd { display: flex; gap: 8px; margin-inline-start: auto; }
  #titleRows { max-height: 560px; overflow-y: auto; }

  /* ---- dialog: the player app's ConfirmModal */
  .backdrop { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
  .dialog { background: var(--white); border: 2px solid var(--ink); box-shadow: calc(6px * var(--dx)) 6px 0 var(--ink); padding: 24px; width: 100%; max-width: 512px; }
  .dialog h2 { font-size: 22px; line-height: 1.4; margin: 0 0 8px; font-weight: 700; }
  .dialog p { margin: 0 0 16px; color: var(--neutral700); }

  /* ---- toast */
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 10px 18px; font-weight: 700; font-size: 14px; z-index: 60; border: 2px solid var(--ink); box-shadow: calc(4px * var(--dx)) 4px 0 var(--purple); max-width: calc(100% - 32px); }
  .toast.error { background: var(--red); box-shadow: calc(4px * var(--dx)) 4px 0 var(--ink); }

  /* Narrower windows: the tabs are icons only (named by their tooltip), as the player app's are on a phone. */
  @media (max-width: 1100px) {
    .navTab .label { display: none; }
  }
  @media (max-width: 760px) {
    .brandName { display: none; }
    header.site .bar { padding: 10px 16px; row-gap: 8px; }
    /* Phone: logo and account on the first line, the sections as one full-width row under them. */
    nav#mainNav { order: 3; width: 100%; justify-content: space-between; }
    main { padding: 0 16px 32px; }
    .row { flex-direction: column; gap: 0; }
    .card { padding: 16px; }
    .pageHead h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<header class="site">
 <div class="bar">
  <a class="brand" id="brandHome" href="#">
    <span id="brandMark"><img class="brandLogo" src="brand-logo.png" alt="Bas Bedoon Kalam" /></span>
    <span class="brandName hidden" id="brandName">Bas Bedoon Kalam</span>
    <span class="brandTag" data-i18n="brand.tag">ADMIN</span>
  </a>
  <nav id="mainNav" class="hidden">
    <button class="navTab" data-tab="decks"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14"/><path d="M7 3h14v14"/></svg><span class="label" data-i18n="nav.decks">Decks</span></button>
    <button class="navTab" data-tab="players"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span class="label" data-i18n="nav.players">Players</span></button>
    <button class="navTab" data-tab="admins"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span class="label" data-i18n="nav.admins">Admins</span></button>
    <button class="navTab" data-tab="auditLog"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span class="label" data-i18n="nav.audit">Audit log</span></button>
    <button class="navTab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span class="label" data-i18n="nav.settings">Settings</span></button>
  </nav>
  <div class="headerEnd">
    <div class="account hidden" id="accountBox">
      <span class="chip" id="whoami"></span>
      <button class="iconBtn" id="logoutBtn" data-i18n-aria="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
    <button class="langToggle" id="langToggle"></button>
  </div>
 </div>
</header>

<main>
  <div id="gate" class="card gate">
    <h2 data-i18n="gate.title">Sign in</h2>
    <p class="lead" data-i18n="gate.lead"></p>
    <div class="field"><label for="usernameInput" data-i18n="common.username"></label><input id="usernameInput" type="text" dir="auto" autocomplete="username" /></div>
    <div class="field"><label for="passwordInput" data-i18n="common.password"></label><input id="passwordInput" type="password" autocomplete="current-password" /></div>
    <p id="gateError" class="result error"></p>
    <div class="actions"><button class="btn" id="signInBtn" data-i18n="gate.signIn"></button></div>
  </div>

  <div id="app" class="hidden">

    <section id="decksSection">
      <div id="deckListView">
        <div class="pageHead"><h1 data-i18n="nav.decks"></h1><p data-i18n="decks.lead"></p></div>
        <div class="card" id="decksList"></div>
      </div>

      <div id="deckEditView" class="hidden">
        <a class="back" id="deckBackLink" data-i18n="deck.back"></a>
        <div class="pageHead"><h1 id="deckEditTitle"></h1></div>
        <div class="card">
          <h2 data-i18n="deck.details"></h2>
          <div class="row">
            <div class="field"><label for="dId" data-i18n="deck.id"></label><input id="dId" dir="ltr" /><p class="hint" data-i18n="deck.idHint"></p></div>
          </div>
          <div class="row">
            <div class="field"><label for="dNameEn" data-i18n="deck.nameEn"></label><input id="dNameEn" dir="ltr" /></div>
            <div class="field"><label for="dNameAr" data-i18n="deck.nameAr"></label><input id="dNameAr" dir="rtl" /></div>
          </div>
          <div class="row">
            <div class="field">
              <label for="dLanguage" data-i18n="deck.language"></label>
              <select id="dLanguage">
                <option value="ar" data-i18n="deck.langAr"></option>
                <option value="en" data-i18n="deck.langEn"></option>
              </select>
            </div>
            <div class="field">
              <label for="dDifficulty" data-i18n="deck.difficulty"></label>
              <select id="dDifficulty">
                <option value="easy" data-i18n="deck.diffEasy"></option>
                <option value="medium" data-i18n="deck.diffMedium"></option>
                <option value="hard" data-i18n="deck.diffHard"></option>
              </select>
              <p class="hint" data-i18n="deck.diffHint"></p>
            </div>
          </div>
          <div class="field" id="deckImageField">
            <label for="deckImageFile" data-i18n="deck.picture"></label>
            <div class="imageField">
              <img id="deckImagePreview" alt="" />
              <input id="deckImageFile" type="file" accept=".png,.jpg,.jpeg,.webp" />
            </div>
          </div>
          <p id="deckResult" class="result"></p>
          <div class="actions">
            <button class="btn danger" id="deleteDeckBtn" data-i18n="deck.delete"></button>
            <button class="btn secondary" id="removeDeckImageBtn" data-i18n="deck.removePicture"></button>
            <button class="btn secondary" id="cancelDeckBtn" data-i18n="common.cancel"></button>
            <button class="btn" id="saveDeckBtn"></button>
          </div>
        </div>

        <div id="deckContent">
          <div class="card">
            <h2 data-i18n="add.title"></h2>
            <p class="lead" data-i18n="add.lead"></p>
            <div class="row">
              <div class="field"><label for="newTitleText" data-i18n="add.text"></label><input id="newTitleText" dir="auto" /></div>
              <div class="field"><label for="newTitleImage" data-i18n="add.picture"></label><input id="newTitleImage" type="file" accept=".png,.jpg,.jpeg,.webp" /></div>
            </div>
            <p id="addTitleResult" class="result"></p>
            <div class="actions"><button class="btn" id="addTitleBtn" data-i18n="add.btn"></button></div>
          </div>

          <div class="card">
            <h2 data-i18n="imp.title"></h2>
            <p class="lead" data-i18n="imp.lead"></p>
            <div class="field"><label for="importFile" data-i18n="imp.file"></label><input id="importFile" type="file" accept=".docx,.xlsx,.pdf" /></div>
            <p id="importResult" class="result"></p>
            <div class="actions"><button class="btn" id="importBtn" data-i18n="imp.btn"></button></div>
          </div>

          <div class="card">
            <h2 data-i18n="impi.title"></h2>
            <p class="lead" data-i18n="impi.lead"></p>
            <div class="row">
              <div class="field"><label for="imageManifestFile" data-i18n="impi.manifest"></label><input id="imageManifestFile" type="file" accept=".xlsx" /></div>
              <div class="field"><label for="imageZipFile" data-i18n="impi.zip"></label><input id="imageZipFile" type="file" accept=".zip" /></div>
            </div>
            <p id="importWithImagesResult" class="result"></p>
            <div class="actions"><button class="btn" id="importWithImagesBtn" data-i18n="impi.btn"></button></div>
          </div>

          <div class="card">
            <h2 id="titlesHeading"></h2>
            <div class="toolbar"><div class="search"><label for="titleFilter" data-i18n="titles.filter"></label><input id="titleFilter" type="search" dir="auto" data-i18n-ph="titles.filterPh" /></div></div>
            <div id="titleRows"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="playersSection" class="hidden">
      <div class="pageHead"><h1 data-i18n="nav.players"></h1><p data-i18n="players.lead"></p></div>
      <div class="card" id="playersList"></div>
    </section>

    <section id="adminsSection" class="hidden">
      <div class="pageHead"><h1 data-i18n="nav.admins"></h1><p data-i18n="admins.lead"></p></div>
      <div class="card" id="adminsList"></div>
    </section>

    <section id="auditLogSection" class="hidden">
      <div class="pageHead"><h1 data-i18n="nav.audit"></h1><p data-i18n="audit.lead"></p></div>
      <div class="card" id="auditList"></div>
    </section>

    <section id="settingsSection" class="hidden">
      <div class="pageHead"><h1 data-i18n="nav.settings"></h1><p data-i18n="settings.lead"></p></div>

      <div class="card">
        <h2 data-i18n="brandSet.title"></h2>
        <p class="lead" data-i18n="brandSet.lead"></p>
        <div class="row">
          <div class="field"><label for="appNameEn" data-i18n="brandSet.nameEn"></label><input id="appNameEn" dir="ltr" maxlength="60" /></div>
          <div class="field"><label for="appNameAr" data-i18n="brandSet.nameAr"></label><input id="appNameAr" dir="rtl" maxlength="60" /></div>
        </div>
        <div class="row">
          <div class="field">
            <label for="timezoneSelect" data-i18n="brandSet.timezone"></label>
            <select id="timezoneSelect" dir="ltr"></select>
          </div>
          <div class="field">
            <label for="logoFile" data-i18n="brandSet.logo"></label>
            <div class="imageField">
              <img id="logoPreview" alt="" />
              <input id="logoFile" type="file" accept=".png,.jpg,.jpeg,.webp" />
            </div>

let lang = (() => {
  try { return localStorage.getItem('adminLang') === 'ar' ? 'ar' : 'en'; } catch { return 'en'; }
})();

function t(key, params = {}) {
  const s = STRINGS[lang][key] ?? STRINGS.en[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (m, k) => (k in params ? String(params[k]) : m));
}

/* ------------------------------------------------------------ session */

// The player app's own sign-in form (app/account.tsx) tries an admin login
// as a fallback after a player login fails, and on success opens this page
// with the freshly issued token/username in the URL fragment — so an admin
// never needs a separate "Admin sign-in" link to find this form. The
// fragment, not the query string: browsers never send it to the server, so
// the token never reaches nginx's access logs. Adopt it into the same
// sessionStorage the normal sign-in form below already uses, then scrub it
// out of the visible URL/history immediately: it's only ever meant to
// travel here once.
(function adoptIncomingSession() {
  const params = new URLSearchParams(location.hash.slice(1));
  const incomingToken = params.get('token');
  if (!incomingToken) return;
  sessionStorage.setItem('adminSessionToken', incomingToken);
  sessionStorage.setItem('adminUsername', params.get('username') || '');
  history.replaceState({}, '', location.pathname);
})();

let token = sessionStorage.getItem('adminSessionToken') || '';
let currentUsername = sessionStorage.getItem('adminUsername') || '';
// The app's own name, which the built-in brand logo (brand-logo.png) spells out.
const DEFAULT_NAMES = { appNameEn: 'Bas Bedoon Kalam', appNameAr: 'بس بدون كلام' };
let branding = { ...DEFAULT_NAMES, logoPath: null, timezone: 'Asia/Kuwait' };
let currentTab = null;
let currentDeckId = null;
let currentDeck = null;

const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function appName() {
  return (lang === 'ar' ? branding.appNameAr : branding.appNameEn) || branding.appNameEn;
}

/** Every date in this tool is shown in the admin-set timezone (Settings → Branding), same as the player app. */
function formatDate(ts, withTime) {
  const locale = lang === 'ar' ? 'ar-KW' : 'en-GB';
  const options = withTime ? { dateStyle: 'medium', timeStyle: 'short' } : { dateStyle: 'medium' };
  try {
    return new Intl.DateTimeFormat(locale, { ...options, timeZone: branding.timezone }).format(ts);
  } catch {
    return new Intl.DateTimeFormat(locale, options).format(ts);
  }
}

function api(path, opts = {}) {
  return fetch(path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token },
  }).then(async (res) => {
    // The session ended server-side (expired, password changed, account
    // deleted): back to the sign-in form rather than an "unauthorized" error.
    if (res.status === 401) {
      signOut();
      throw new Error('signed out');
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || ('HTTP ' + res.status));
    }
    if (res.status === 204) return null;
    return res.json();
  });
}

function jsonBody(method, body) {
  return { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
}

/* ------------------------------------------------------------ feedback */

let toastTimer = null;
function toast(message, isError) {
  const el = $('toast');
  el.textContent = message;
  el.classList.toggle('error', Boolean(isError));
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), isError ? 6000 : 3000);
}

function setResult(id, message, isError) {
  $(id).textContent = message || '';
  $(id).classList.toggle('error', Boolean(isError));
}

/** A failure worth showing — a 401 already sent the admin back to the sign-in form. */
function reportable(e) {
  return e.message !== 'signed out';
}

/** Runs `fn` with `btn` disabled and relabelled, restoring both afterwards. */
async function withBusy(btn, busyLabel, fn) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = busyLabel;
  try {
    return await fn();
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

/**
 * The one dialog — confirmations and small forms alike — in place of the
 * browser's own prompt/confirm/alert, so every question looks like the rest
 * of the product. Resolves the fields' values (or `{}`) on confirm, `null`
 * on cancel. `onConfirm` may throw to keep it open with the error shown.
 */
function openDialog({ title, body = '', fields = [], confirmLabel = t('common.save'), destructive = false, onConfirm }) {
  return new Promise((resolve) => {
    $('dialogTitle').textContent = title;
    $('dialogBody').textContent = body;
    $('dialogBody').classList.toggle('hidden', !body);
    $('dialogFields').innerHTML = fields.map((f, i) => `
      <div class="field">
        <label for="dlgField${i}">${escapeHtml(f.label)}</label>
        <input id="dlgField${i}" type="${f.type || 'text'}" dir="${f.type === 'password' ? 'ltr' : 'auto'}" value="${escapeHtml(f.value || '')}" ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ''} />
      </div>`).join('');
    setResult('dialogError', '');
    const confirmBtn = $('dialogConfirm');
    confirmBtn.textContent = confirmLabel;
    confirmBtn.className = destructive ? 'btn danger' : 'btn';
    $('dialog').classList.remove('hidden');
    const first = $('dialogFields').querySelector('input');
    (first || confirmBtn).focus();

    let submitting = false;
    const values = () => Object.fromEntries(fields.map((f, i) => [f.name, $('dlgField' + i).value]));
    const close = (result) => {
      $('dialog').classList.add('hidden');
      confirmBtn.onclick = null;
      $('dialogCancel').onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(result);
    };
    const confirm = async () => {
      // Enter and a click can both land while a save is still in flight.
      if (submitting) return;
      const v = values();
      if (!onConfirm) return close(v);
      submitting = true;
      try {
        await withBusy(confirmBtn, t('common.saving'), () => onConfirm(v));
        close(v);
      } catch (e) {
        if (reportable(e)) setResult('dialogError', e.message, true);
      } finally {
        submitting = false;
      }
    };
    const onKey = (e) => {
      if (e.key === 'Escape' && !submitting) close(null);
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') confirm();
    };
    confirmBtn.onclick = confirm;
    $('dialogCancel').onclick = () => { if (!submitting) close(null); };
    document.addEventListener('keydown', onKey);
  });
}

/**
 * The header mark, by the player app's rule (src/ui/Logo.tsx): the built-in
 * brand logo in both languages; an uploaded logo instead once there is one;
 * and a renamed app with no logo of its own gets the plain cube, since the
 * brand logo spells out the original name. A logo picture is the brand on
 * its own — the name is printed beside the cube only.
 */
function applyBranding() {
  const builtIn = !branding.logoPath
    && branding.appNameEn === DEFAULT_NAMES.appNameEn && branding.appNameAr === DEFAULT_NAMES.appNameAr;
  $('brandName').textContent = appName();
  $('brandName').classList.toggle('hidden', builtIn || Boolean(branding.logoPath));

  $('brandMark').innerHTML = builtIn
    ? `<img class="brandLogo" src="brand-logo.png" alt="${escapeHtml(appName())}" />`
    : branding.logoPath
      ? `<img src="${escapeHtml(branding.logoPath)}" alt="${escapeHtml(appName())}" />`
      : '<span class="cube"><span class="front"></span><span class="side"></span><span class="top"></span></span>';
  $('brandMark').className = builtIn || branding.logoPath ? '' : 'cubeWrap';
}

/** Puts every fixed label in the current language and lays the page out in its direction. */
function applyLanguage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.navTab').forEach((el) => {
    const label = el.querySelector('.label').textContent;
    el.setAttribute('aria-label', label);
    el.title = label;
  });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
    el.setAttribute('aria-label', t(el.dataset.i18nAria));
    el.title = t(el.dataset.i18nAria);
  });
  $('langToggle').textContent = t('lang.toggle');
  $('langToggle').setAttribute('aria-label', t('lang.switchTo'));
  applyBranding();
}

function switchLanguage() {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('adminLang', lang); } catch { /* per-visit only */ }
  applyLanguage();

async function signIn() {
  const username = $('usernameInput').value.trim();
  const password = $('passwordInput').value;
  setResult('gateError', '');
  try {
    const data = await withBusy($('signInBtn'), t('gate.signingIn'), async () => {
      const res = await fetch('/admin/auth/login', jsonBody('POST', { username, password }));
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || t('gate.failed'));
      }
      return res.json();
    });
    token = data.token;
    currentUsername = data.user.username;
    sessionStorage.setItem('adminSessionToken', token);
    sessionStorage.setItem('adminUsername', currentUsername);
    enterApp();
  } catch (e) {
    setResult('gateError', e.message, true);
  }
}

function signOut() {
  token = '';
  currentUsername = '';
  sessionStorage.removeItem('adminSessionToken');
  sessionStorage.removeItem('adminUsername');
  location.reload();
}

async function enterApp() {
  try {
    // Also proves the stored token still works.
    branding = await api('/admin/settings/branding');
  } catch (e) {
    // Stored token is stale/invalid — fall back to the sign-in form.
    signOut();
    return;
  }
  applyBranding();
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('mainNav').classList.remove('hidden');
  $('accountBox').classList.remove('hidden');
  $('whoami').textContent = currentUsername;
  showTab('decks');
}

/**
 * One searchable, sortable, paged list — the same for decks, players,
 * admins and the audit log. The server does the work (`?q=&page=&pageSize=
 * &sort=&dir=`, see parseListQuery); this only keeps the controls' state.
 * `primary` is the list's own action, at the end of its bottom bar like
 * every other card's. `columns[].sort` may be a function of the language
 * (a deck's name sorts by its name in the language being read).
 */
function createList({ mount, endpoint, columns, defaultSort, defaultDir, row, emptyKey, searchKey, primary, bind }) {
  const state = { q: '', page: 1, pageSize: 20, sort: defaultSort, dir: defaultDir, items: [], total: 0 };
  const el = $(mount);
  let tbody = null;
  const sortKey = (c) => (typeof c.sort === 'function' ? c.sort() : c.sort);

  function renderShell() {
    // A sort by a language-dependent column follows the language switch.
    columns.forEach((c) => {
      if (typeof c.sort === 'function' && c.sortKeys.includes(state.sort)) state.sort = c.sort();
    });
    el.innerHTML = `
      <div class="toolbar">
        <div class="search"><label for="${mount}Search">${escapeHtml(t('list.search'))}</label><input id="${mount}Search" type="search" dir="auto" placeholder="${escapeHtml(t(searchKey))}" /></div>
        <div class="size"><label for="${mount}Size">${escapeHtml(t('list.perPage'))}</label>
          <select id="${mount}Size">${[10, 20, 50, 100].map((n) => `<option ${n === state.pageSize ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      </div>
      <div class="tableWrap"><table>
        <thead><tr>${columns.map((c) => c.sort
          ? `<th><button class="sort" data-sort="${sortKey(c)}">${escapeHtml(t(c.label))} <span class="arrow"></span></button></th>`
          : `<th>${c.label ? escapeHtml(t(c.label)) : ''}</th>`).join('')}</tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="actions withPager">
        <div class="pager">
          <span class="info"></span>
          <button class="btn secondary sm prev">${escapeHtml(t('list.prev'))}</button>
          <span class="pageNo"></span>
          <button class="btn secondary sm next">${escapeHtml(t('list.next'))}</button>
        </div>
        ${primary ? `<div class="end"><button class="btn" id="${mount}Primary">${escapeHtml(t(primary.label))}</button></div>` : ''}
      </div>`;
    tbody = el.querySelector('tbody');
    $(mount + 'Search').value = state.q;

    let debounce = null;
    $(mount + 'Search').addEventListener('input', (e) => {
      clearTimeout(debounce);
      debounce = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; load(); }, 300);
    });
    $(mount + 'Size').addEventListener('change', (e) => { state.pageSize = Number(e.target.value); state.page = 1; load(); });
    el.querySelector('.prev').addEventListener('click', () => { state.page -= 1; load(); });
    el.querySelector('.next').addEventListener('click', () => { state.page += 1; load(); });
    el.querySelectorAll('button.sort').forEach((b) => b.addEventListener('click', () => {
      if (state.sort === b.dataset.sort) state.dir = state.dir === 'asc' ? 'desc' : 'asc';
      else { state.sort = b.dataset.sort; state.dir = b.dataset.sort === 'created' ? 'desc' : 'asc'; }
      state.page = 1;
      load();
    }));
    if (primary) $(mount + 'Primary').addEventListener('click', primary.onClick);
  }

  // Only the latest request may draw — a slow earlier one (typing fast in
  // the search box) must not overwrite a newer answer.
  let requestNo = 0;
  async function load() {
    const mine = ++requestNo;
    const params = new URLSearchParams({ page: state.page, pageSize: state.pageSize, sort: state.sort, dir: state.dir });
    if (state.q) params.set('q', state.q);
    let data;
    try {
      data = await api(endpoint + '?' + params);
    } catch (e) {
      if (reportable(e) && mine === requestNo) toast(t('common.loadFailed', { e: e.message }), true);
      return;
    }
    if (mine !== requestNo) return;
    const lastPage = Math.max(1, Math.ceil(data.total / state.pageSize));
    if (state.page > lastPage) { state.page = lastPage; return load(); }
    state.items = data.items;
    state.total = data.total;
    tbody.innerHTML = data.items.length
      ? data.items.map(row).join('')
      : `<tr><td class="empty" colspan="${columns.length}">${escapeHtml(state.q ? t('list.noMatch', { q: state.q }) : t(emptyKey))}</td></tr>`;
    const from = data.total ? (state.page - 1) * state.pageSize + 1 : 0;
    const to = Math.min(data.total, state.page * state.pageSize);
    el.querySelector('.info').textContent = t('list.range', { from, to, total: data.total });
    el.querySelector('.pageNo').textContent = t('list.page', { page: state.page, last: lastPage });
    el.querySelector('.prev').disabled = state.page <= 1;
    el.querySelector('.next').disabled = state.page >= lastPage;
    el.querySelectorAll('button.sort').forEach((b) => {
      const on = b.dataset.sort === state.sort;
      b.classList.toggle('on', on);
      b.querySelector('.arrow').textContent = on ? (state.dir === 'asc' ? '▲' : '▼') : '↕';
    });
    if (bind) bind(tbody, state.items);
  }

  renderShell();
  return { load, renderShell };
}

/** The deck editor's labels that depend on the deck — redrawn on a language switch without touching unsaved field edits. */
function refreshDeckLabels() {
  const d = currentDeck;
  const isNew = !currentDeckId;
  $('deckEditTitle').textContent = isNew ? t('deck.new') : (lang === 'ar' ? d.nameAr : d.nameEn) || d.id;
  $('saveDeckBtn').textContent = t(isNew ? 'deck.create' : 'deck.save');

}

function renderDeckEdit() {
  $('deckListView').classList.add('hidden');
  $('deckEditView').classList.remove('hidden');
  const d = currentDeck;
  const isNew = !currentDeckId;
  $('dId').value = d.id;
  $('dId').disabled = !isNew;
  $('dNameAr').value = d.nameAr;
  $('dNameEn').value = d.nameEn;
  $('dLanguage').value = d.language;
  $('dDifficulty').value = d.difficulty || 'medium';
  $('deleteDeckBtn').classList.toggle('hidden', isNew);
  $('cancelDeckBtn').classList.toggle('hidden', !isNew);
  $('deckImagePreview').src = d.imagePath || '';
  $('deckImagePreview').style.visibility = d.imagePath ? 'visible' : 'hidden';
  $('deckImageFile').value = '';
  $('removeDeckImageBtn').classList.toggle('hidden', !d.imagePath);
  // Pictures and titles need the deck to exist first.
  $('deckImageField').classList.toggle('hidden', isNew);
  $('deckContent').classList.toggle('hidden', isNew);
  ['deckResult', 'addTitleResult', 'importResult', 'importWithImagesResult'].forEach((id) => setResult(id, ''));
  ['newTitleText', 'newTitleImage', 'importFile', 'imageManifestFile', 'imageZipFile'].forEach((id) => { $(id).value = ''; });

}

function renderTitles() {

    <div class="titleRow">
      <img src="${x.imagePath ? escapeHtml(x.imagePath) : ''}" alt="" style="${x.imagePath ? '' : 'visibility:hidden'}" />
      <input dir="auto" value="${escapeHtml(x.text)}" data-title-text="${escapeHtml(x.id)}" aria-label="${escapeHtml(t('aria.title'))}" />
      <select data-title-difficulty="${escapeHtml(x.id)}" aria-label="${escapeHtml(t('aria.difficulty'))}" title="${escapeHtml(t('titles.override'))}">
        <option value="" ${!x.difficulty ? 'selected' : ''}>${escapeHtml(t('titles.deckDefault'))}</option>
        ${['easy', 'medium', 'hard'].map((lv) => `<option value="${lv}" ${x.difficulty === lv ? 'selected' : ''}>${escapeHtml(t('diff.' + lv))}</option>`).join('')}
      </select>
      <input type="file" accept=".png,.jpg,.jpeg,.webp" data-title-image="${escapeHtml(x.id)}" aria-label="${escapeHtml(t('aria.picture'))}" />
      <div class="rowEnd">
        <button class="btn danger sm" data-remove-title="${escapeHtml(x.id)}">${escapeHtml(t('titles.remove'))}</button>
        ${x.imagePath ? `<button class="btn secondary sm" data-remove-image="${escapeHtml(x.id)}">${escapeHtml(t('deck.removePicture'))}</button>` : ''}
        <button class="btn sm" data-save-title="${escapeHtml(x.id)}">${escapeHtml(t('titles.save'))}</button>
      </div>
    </div>
  `).join('') || `<p class="muted">${escapeHtml(t(filter ? 'titles.noMatch' : 'titles.none'))}</p>`;
  $('titleRows').querySelectorAll('[data-remove-title]').forEach((btn) => btn.addEventListener('click', () => removeTitle(btn.dataset.removeTitle)));
  $('titleRows').querySelectorAll('[data-save-title]').forEach((btn) => btn.addEventListener('click', () => saveTitleEdit(btn.dataset.saveTitle, btn)));
  $('titleRows').querySelectorAll('[data-remove-image]').forEach((btn) => btn.addEventListener('click', () => removeTitleImage(btn.dataset.removeImage)));
}

async function saveDeck() {
  const body = {
    nameAr: $('dNameAr').value.trim(),
    nameEn: $('dNameEn').value.trim(),
    language: $('dLanguage').value,
    difficulty: $('dDifficulty').value,
  };
  await withBusy($('saveDeckBtn'), t('common.saving'), async () => {
    try {
      if (currentDeckId) {
        currentDeck = await api(deckUrl(), jsonBody('PUT', body));
        const file = $('deckImageFile').files[0];
        if (file) {
          const form = new FormData();
          form.append('image', file);
          currentDeck = await api(deckUrl('/image'), { method: 'PUT', body: form });
        }
      } else {
        const id = $('dId').value.trim();
        currentDeck = await api('/admin/decks', jsonBody('POST', { id, ...body }));
        currentDeckId = currentDeck.id;
      }
      renderDeckEdit();
      setResult('deckResult', t('common.saved'));
    } catch (e) {
      if (reportable(e)) setResult('deckResult', t('common.saveFailed', { e: e.message }), true);
    }
  });
  // withBusy put back the label it found; a deck just created now says "Save deck".
  if (currentDeckId) $('saveDeckBtn').textContent = t('deck.save');
}

async function deleteDeck() {
  await openDialog({
    title: t('deck.deleteTitle'),
    body: t('deck.deleteBody', { name: (lang === 'ar' ? currentDeck.nameAr : currentDeck.nameEn) || currentDeckId, count: currentDeck.titles.length }),
    confirmLabel: t('deck.delete'),
    destructive: true,
    onConfirm: async () => {
      await api(deckUrl(), { method: 'DELETE' });
      toast(t('deck.deleted'));
      showDeckList();
    },
  });
}

async function removeDeckImage() {
  const form = new FormData();
  form.append('removeImage', 'true');
  try {
    currentDeck = await api(deckUrl('/image'), { method: 'PUT', body: form });
    renderDeckEdit();
    setResult('deckResult', t('deck.pictureRemoved'));
  } catch (e) {
    if (reportable(e)) setResult('deckResult', t('deck.pictureRemoveFailed', { e: e.message }), true);
  }
}

async function addTitle() {
  const text = $('newTitleText').value.trim();
  if (!text) { setResult('addTitleResult', t('add.empty'), true); return; }
  const form = new FormData();
  form.append('text', text);
  const file = $('newTitleImage').files[0];
  if (file) form.append('image', file);
  await withBusy($('addTitleBtn'), t('add.busy'), async () => {
    try {
      const result = await api(deckUrl('/titles'), { method: 'POST', body: form });
      currentDeck = result.deck;
      renderDeckEdit();
      setResult('addTitleResult', t(result.added ? 'add.added' : 'add.dup'), !result.added);
    } catch (e) {
      if (reportable(e)) setResult('addTitleResult', t('add.failed', { e: e.message }), true);
    }
  });
}

async function importTitles() {
  const file = $('importFile').files[0];
  if (!file) { setResult('importResult', t('imp.choose'), true); return; }
  const form = new FormData();
  form.append('file', file);
  await withBusy($('importBtn'), t('imp.busy'), async () => {
    setResult('importResult', t('imp.wait'));
    try {
      const result = await api(deckUrl('/import'), { method: 'POST', body: form });
      currentDeck = result.deck;
      renderDeckEdit();
      setResult('importResult', t('imp.result', { found: result.titlesFound, added: result.added, skipped: result.skipped }));
    } catch (e) {
      setResult('importResult', reportable(e) ? t('imp.failed', { e: e.message }) : '', true);
    }
  });
}

async function importTitlesWithImages() {
  const manifest = $('imageManifestFile').files[0];
  const images = $('imageZipFile').files[0];
  if (!manifest || !images) { setResult('importWithImagesResult', t('impi.choose'), true); return; }
  const form = new FormData();
  form.append('manifest', manifest);
  form.append('images', images);
  await withBusy($('importWithImagesBtn'), t('imp.busy'), async () => {
    setResult('importWithImagesResult', t('imp.wait'));
    try {
      const result = await api(deckUrl('/import-with-images'), { method: 'POST', body: form });
      currentDeck = result.deck;
      renderDeckEdit();
      let msg = t('impi.result', { found: result.titlesFound, added: result.added, skipped: result.skipped });
      if (result.imageIssues.length) msg += t('impi.issues', { count: result.imageIssues.length, list: result.imageIssues.join('; ') });
      setResult('importWithImagesResult', msg);
    } catch (e) {
      setResult('importWithImagesResult', reportable(e) ? t('imp.failed', { e: e.message }) : '', true);
    }
  });
}

/** Re-fetches the open deck, keeping the title filter as typed. */
async function refreshDeck() {
  currentDeck = await api(deckUrl());
  const filter = $('titleFilter').value;
  renderDeckEdit();
  $('titleFilter').value = filter;
  renderTitles();
}

async function saveTitleEdit(titleId, btn) {
  const form = new FormData();
  form.append('text', document.querySelector('[data-title-text="' + CSS.escape(titleId) + '"]').value.trim());
  // Empty clears the override, back to the deck's default.
  form.append('difficulty', document.querySelector('[data-title-difficulty="' + CSS.escape(titleId) + '"]').value);
  const file = document.querySelector('[data-title-image="' + CSS.escape(titleId) + '"]').files[0];
  if (file) form.append('image', file);
  await withBusy(btn, t('common.saving'), async () => {
    try {
      await api(deckUrl('/titles/' + encodeURIComponent(titleId)), { method: 'PUT', body: form });
      await refreshDeck();
      toast(t('titles.saved'));
    } catch (e) {
      if (reportable(e)) toast(t('common.saveFailed', { e: e.message }), true);
    }
  });
}

async function removeTitle(titleId) {
  const title = currentDeck.titles.find((x) => x.id === titleId);
  await openDialog({
    title: t('titles.removeTitle'),
    body: title ? t('titles.removeBody', { text: title.text }) : '',
    confirmLabel: t('titles.remove'),
    destructive: true,
    onConfirm: async () => {
      await api(deckUrl('/titles/' + encodeURIComponent(titleId)), { method: 'DELETE' });
      await refreshDeck();
      toast(t('titles.removed'));
    },
  });
}

async function removeTitleImage(titleId) {
  const form = new FormData();
  form.append('removeImage', 'true');
  try {
    await api(deckUrl('/titles/' + encodeURIComponent(titleId)), { method: 'PUT', body: form });
    await refreshDeck();
    toast(t('deck.pictureRemoved'));
  } catch (e) {
    if (reportable(e)) toast(t('deck.pictureRemoveFailed', { e: e.message }), true);
  }
}

/* ------------------------------------------------------------ audit log */

function summarizeAuditEntry(entry) {
  // A small per-action renderer rather than a raw JSON dump, so the common
  // cases read as a sentence; anything unrecognized still shows something.
  const before = entry.before || {};
  const after = entry.after || {};
  if (entry.action === 'deck.update' || entry.action === 'settings.branding.update') {
    const changed = Object.keys(after).filter((k) => JSON.stringify(after[k]) !== JSON.stringify(before[k]));
    return changed.length ? t('audit.changed', { fields: changed.join(', ') }) : '';
  }
  if (entry.action === 'settings.branding.logo') return t(after.logoPath ? 'audit.newLogo' : 'audit.builtInLogo');
  if (entry.action === 'deck.import') return t('audit.import', { added: after.added, skipped: after.skipped });
  if (entry.action === 'settings.game-price.update' || entry.action === 'settings.modified-game-price.update') {
    return `${(before.fils / 1000).toFixed(3)} KD → ${(after.fils / 1000).toFixed(3)} KD`;
  }
  if (entry.action.endsWith('.update') && 'passwordChanged' in after) {
    return t(after.passwordChanged ? 'audit.passwordChanged' : 'audit.detailsChanged');
  }
  return '';
}

function timezones() {
  const all = typeof Intl.supportedValuesOf === 'function'
    ? Intl.supportedValuesOf('timeZone')
    : ['Asia/Kuwait', 'Asia/Riyadh', 'Asia/Dubai', 'Asia/Qatar', 'Asia/Bahrain', 'Asia/Muscat', 'Africa/Cairo', 'Europe/London', 'UTC'];
  return all.includes(branding.timezone) ? all : [branding.timezone, ...all];
}

function renderBranding() {
  $('appNameEn').value = branding.appNameEn;
  $('appNameAr').value = branding.appNameAr;
  $('timezoneSelect').innerHTML = timezones().map((tz) => `<option ${tz === branding.timezone ? 'selected' : ''}>${escapeHtml(tz)}</option>`).join('');
  $('logoPreview').src = branding.logoPath || '';
  $('logoPreview').style.visibility = branding.logoPath ? 'visible' : 'hidden';
  $('logoFile').value = '';
  $('removeLogoBtn').classList.toggle('hidden', !branding.logoPath);
}

async function loadSettings() {
  try {
    const [b, price, modifiedPrice, homeContent] = await Promise.all([
      api('/admin/settings/branding'),
      api('/admin/settings/game-price'),
      api('/admin/settings/modified-game-price'),
      api('/admin/settings/home-content'),
    ]);
    branding = b;
    renderBranding();
    applyBranding();
    $('gamePriceInput').value = (price.fils / 1000).toFixed(3);
    $('modifiedGamePriceInput').value = (modifiedPrice.fils / 1000).toFixed(3);
    $('homeTaglineEn').value = homeContent.taglineEn;
    $('homeTaglineAr').value = homeContent.taglineAr;
    $('homeWriteupEn').value = homeContent.writeupEn;
    $('homeWriteupAr').value = homeContent.writeupAr;
    ['brandingResult', 'pricesResult', 'homeContentResult'].forEach((id) => setResult(id, ''));
  } catch (e) {
    if (reportable(e)) toast(t('settings.loadFailed', { e: e.message }), true);
  }
}

async function saveBranding() {
  await withBusy($('saveBrandingBtn'), t('common.saving'), async () => {
    try {
      branding = await api('/admin/settings/branding', jsonBody('PUT', {
        appNameEn: $('appNameEn').value,
        appNameAr: $('appNameAr').value,
        timezone: $('timezoneSelect').value,
      }));
      const file = $('logoFile').files[0];
      if (file) {
        const form = new FormData();
        form.append('logo', file);
        branding = await api('/admin/settings/branding/logo', { method: 'PUT', body: form });
      }
      renderBranding();
      applyBranding();
      setResult('brandingResult', t('brandSet.saved'));
    } catch (e) {
      if (reportable(e)) setResult('brandingResult', t('common.saveFailed', { e: e.message }), true);
    }
  });
}

async function removeLogo() {
  const form = new FormData();
  form.append('removeLogo', 'true');
  try {
    branding = await api('/admin/settings/branding/logo', { method: 'PUT', body: form });
    renderBranding();
    applyBranding();
    setResult('brandingResult', t('brandSet.logoRemoved'));

async function savePrices() {
  const lite = parseFloat($('gamePriceInput').value);
  const pro = parseFloat($('modifiedGamePriceInput').value);
  if (!(lite > 0) || !(pro > 0)) { setResult('pricesResult', t('prices.invalid'), true); return; }
  await withBusy($('savePricesBtn'), t('common.saving'), async () => {
    try {
      const a = await api('/admin/settings/game-price', jsonBody('PUT', { fils: Math.round(lite * 1000) }));
      const b = await api('/admin/settings/modified-game-price', jsonBody('PUT', { fils: Math.round(pro * 1000) }));
      $('gamePriceInput').value = (a.fils / 1000).toFixed(3);
      $('modifiedGamePriceInput').value = (b.fils / 1000).toFixed(3);
      setResult('pricesResult', t('common.saved'));
    } catch (e) {
      if (reportable(e)) setResult('pricesResult', t('common.saveFailed', { e: e.message }), true);
    }
  });
}

async function saveHomeContent() {

      setResult('homeContentResult', t('common.saved'));
    } catch (e) {

    }
  });
}
