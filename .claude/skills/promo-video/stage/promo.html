<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bas Bedoon Kalam — promo</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 800; src: url(fonts/Archivo_800ExtraBold.ttf); }
  @font-face { font-family: 'Archivo'; font-weight: 900; src: url(fonts/Archivo_900Black.ttf); }
  @font-face { font-family: 'Kufi'; font-weight: 500; src: url(fonts/NotoKufiArabic_500Medium.ttf); }
  @font-face { font-family: 'Kufi'; font-weight: 700; src: url(fonts/NotoKufiArabic_700Bold.ttf); }
  @font-face { font-family: 'Kufi'; font-weight: 900; src: url(fonts/NotoKufiArabic_900Black.ttf); }
  :root {
    --ink: #201E1D; --ground: #F3F2F2; --white: #fff; --purple: #8038D1; --purpleTop: #A473EE;
    --purpleSide: #591F97; --green: #6FDB55; --muted: #5B5654;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Archivo', sans-serif; }
  .bg { position: absolute; inset: 0; }
  .el { position: absolute; will-change: transform, opacity; }

  /* text — each language's font and direction are set inline from captions.js */
  .chip { font-weight: 900; font-size: 22px; letter-spacing: 3px; padding: 8px 16px; background: var(--ink); color: var(--white); display: inline-block; }
  .h1 { font-size: 84px; line-height: 1.05; letter-spacing: -1px; color: var(--ink); }
  .sub { font-size: 50px; line-height: 1.5; color: var(--purple); }
  .light .h1 { color: var(--white); }

  /* phones: the app's own screenshots, 1170×2532 */
  .phone { width: 410px; height: 888px; border-radius: 58px; background: var(--ink); padding: 14px; box-shadow: 18px 22px 0 rgba(32,30,29,0.9); }
  .phone img { width: 100%; height: 100%; border-radius: 44px; display: block; object-fit: cover; }
  .phone.onDark { box-shadow: 18px 22px 0 var(--purple); background: #000; }
  .phone.onPurple { box-shadow: 18px 22px 0 var(--ink); }
  .label { font-weight: 800; font-size: 24px; background: var(--white); color: var(--ink); border: 3px solid var(--ink); padding: 8px 16px; box-shadow: 6px 6px 0 var(--ink); white-space: nowrap; }

  /* desktop browser frame */
  .browser { width: 1040px; border: 4px solid var(--ink); background: var(--white); box-shadow: 18px 18px 0 var(--ink); }
  .browser .bar { height: 46px; background: var(--ink); display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  .browser .bar i { width: 14px; height: 14px; border-radius: 50%; background: #5B5654; display: block; }
  .browser .shot { position: relative; height: 650px; overflow: hidden; }
  .browser .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }

  .tags { display: flex; gap: 10px; flex-wrap: wrap; }
  .tags span { font-weight: 800; font-size: 21px; border: 3px solid var(--ink); padding: 5px 11px; background: var(--white); }
  .tags span.p { background: var(--purple); color: var(--white); }
</style>
<!-- Every line of text, per language (fonts, direction) -->
<script src="captions.js"></script>
<!-- Which languages this promo uses — written by make-promo.sh; this default applies when it's missing. -->
<script>window.PROMO = { langs: ['en', 'ar'], screens: ['en', 'ar'] };</script>
<script src="config.js" onerror="void 0"></script>
</head>
<body>
<div id="stage"></div>
<script>
// ---------------------------------------------------------------- languages
// PROMO.langs: the caption languages, the first being each scene's big
// headline and the rest the coloured lines under it. PROMO.screens: which of
// the app's own languages (en, ar) its screenshots are in — the first is the
// phone in front. A headline language written right-to-left mirrors the
// whole layout: text on the right, phones on the left.
const { langs: LANGS, screens: SCREENS } = window.PROMO;
const PRIMARY = LANGS[0];
const SECONDARY = LANGS.slice(1);
const RTL = window.LANGUAGES[PRIMARY].dir === 'rtl';
const cap = (lang, key) => window.CAPTIONS[lang][key];
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]).replace(/\n/g, '<br>');

/**
 * Inline font + direction for a language. `size` is scaled by the language's
 * own `size` (a non-Latin script against the Latin headline); `headline`
 * applies its headline line height (Arabic needs far more than Latin).
 */
function langStyle(lang, { weight, size, center = false, headline = false } = {}) {
  const L = window.LANGUAGES[lang];
  const px = size ? Math.round(size * (L.size || 1)) : null;
  const align = center ? 'center' : RTL ? 'right' : 'left';
  return `font-family:'${L.font}','Archivo',sans-serif;font-weight:${weight || L.weight};direction:${L.dir};text-align:${align};`
    + `${px ? `font-size:${px}px;` : ''}${headline ? `line-height:${L.lineHeight || 1.1};` : ''}`;
}

// ---------------------------------------------------------------- timeline
// Nine scenes, 52 s. Every element enters (eased from an offset) and leaves
// before its scene ends; render(t) is a pure function of time, so the video
// is captured frame by frame with nothing left to chance.
const W = 1920, H = 1080;
const stage = document.getElementById('stage');

const clamp = (x) => Math.max(0, Math.min(1, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIn = (x) => x * x * x;
const easeBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;

/** An x position (of something `w` wide), mirrored when the layout reads right-to-left. */
const mx = (x, w) => (RTL ? W - x - w : x);
const mr = (r) => (RTL ? -r : r);

const scenes = [];
const items = [];

function scene(start, end, bg) {
  const s = { start, end, bg };
  const el = document.createElement('div');
  el.className = 'bg';
  el.style.background = bg;
  stage.appendChild(el);
  s.el = el;
  scenes.push(s);
  return s;
}

/**
 * One animated element. `x,y` place it; `enter` = { at, dur, from: {x,y,s,r,o}, ease };
 * `exit` = { at, dur, to: {...} }. `rest` = its settled state {s, r}. `drift` adds a
 * slow float while it's on screen, so nothing ever sits perfectly still.
 */
function item(html, { x, y, w, cls = '', enter, exit, rest = {}, drift = 0, z = 1, origin = 'center' }) {
  const el = document.createElement('div');
  el.className = 'el ' + cls;
  el.innerHTML = html;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  if (w) el.style.width = w + 'px';
  el.style.zIndex = z;
  el.style.transformOrigin = origin;
  stage.appendChild(el);
  items.push({ el, enter, exit, rest: { x: 0, y: 0, s: 1, r: 0, o: 1, ...rest }, drift });
  return el;
}

function renderItem(it, t) {
  const r = it.rest;
  let st = { ...r };
  if (it.enter) {
    const p = clamp((t - it.enter.at) / it.enter.dur);
    const e = (it.enter.ease || easeOut)(p);
    const f = { ...r, ...it.enter.from };
    st = { x: lerp(f.x, r.x, e), y: lerp(f.y, r.y, e), s: lerp(f.s, r.s, e), r: lerp(f.r, r.r, e), o: lerp(f.o, r.o, clamp(p * 1.6)) };
    if (t < it.enter.at) st.o = 0;
  }
  if (it.exit && t > it.exit.at) {
    const q = easeIn(clamp((t - it.exit.at) / it.exit.dur));
    const to = { ...st, ...it.exit.to };
    st = { x: lerp(st.x, to.x, q), y: lerp(st.y, to.y, q), s: lerp(st.s, to.s, q), r: lerp(st.r, to.r, q), o: lerp(st.o, to.o, q) };
  }
  if (it.drift) st.y += Math.sin(t * 1.3 + it.drift) * 6;
  it.el.style.opacity = st.o.toFixed(3);
  it.el.style.transform = `translate(${st.x.toFixed(2)}px, ${st.y.toFixed(2)}px) scale(${st.s.toFixed(4)}) rotate(${st.r.toFixed(3)}deg)`;
}

const renderHooks = [];
window.render = (t) => {
  // Each background fades in over the previous one, which stays solid until
  // it's fully covered — so a scene change never dips to the page behind.
  for (const s of scenes) {
    const fin = clamp((t - s.start) / 0.45);
    const covered = t > s.end + 0.5;
    s.el.style.opacity = t < s.start || covered ? 0 : fin.toFixed(3);
  }
  for (const it of items) renderItem(it, t);
  for (const hook of renderHooks) hook(t);
};

const TOTAL = 52;
window.TOTAL = TOTAL;

// Shared building blocks -----------------------------------------------------
const up = (at, d = 0.7) => ({ at, dur: d, from: { y: 70, o: 0 } });
const out = (at, d = 0.4) => ({ at, dur: d, to: { y: -40, o: 0 } });
const phoneIn = (at, fromX = 160, r = 0) => ({ at, dur: 0.9, from: { x: RTL ? -fromX : fromX, y: 120, o: 0, r: r + mr(6) }, ease: easeBack });
const phoneOut = (at) => ({ at, dur: 0.45, to: { y: 160, o: 0 } });
const PHONE_W = 410;

// Blocks whose parts are stacked from their real, rendered heights once the
// fonts are in — so a headline that wraps never runs into the line under it.
const stacks = [];

/**
 * A scene's words: the chip, the headline in the first language, then one
 * coloured line per other language — all from captions.js by `key`.
 * `light`: on a dark background; 'purple': on the purple one.
 */
function textBlock(s, n, key, { light = false, x = 150, w = 860, h1Size = 84, subSize = 50, extra } = {}) {
  const end = s.end - 0.45;
  const left = mx(x, w);
  const parts = [];
  const chip = `${String(n).padStart(2, '0')} · ${cap(PRIMARY, 'chips')[n - 1]}`;
  parts.push([item(`<div style="text-align:${RTL ? 'right' : 'left'}"><span class="chip" style="${langStyle(PRIMARY, { weight: 900 })}letter-spacing:${RTL ? 0 : 3}px">${esc(chip)}</span></div>`,
    { x: left, y: 0, w, enter: { at: s.start + 0.2, dur: 0.6, from: { x: RTL ? 40 : -40, o: 0, r: mr(-4) } }, rest: { r: mr(-2) }, exit: out(end), z: 3 }), 28]);
  parts.push([item(`<div class="h1" style="${langStyle(PRIMARY, { size: h1Size, headline: true })}">${esc(cap(PRIMARY, key))}</div>`,
    { x: left, y: 0, w, cls: light ? 'light' : '', enter: up(s.start + 0.35), exit: out(end + 0.03), z: 3 }), 22]);
  // Fewer lines when several languages share the space.
  const size = SECONDARY.length > 1 ? Math.round(subSize * 0.8) : subSize;
  const subColor = light === 'purple' ? '#fff' : light ? '#6FDB55' : '';
  SECONDARY.forEach((lang, i) => {
    parts.push([item(`<div class="sub" style="${langStyle(lang, { size })}${subColor ? `color:${subColor};` : ''}">${esc(cap(lang, key))}</div>`,
      { x: left, y: 0, w, enter: up(s.start + 0.6 + i * 0.15), exit: out(end + 0.06), z: 3 }), i < SECONDARY.length - 1 ? 14 : 36]);
  });
  if (extra) parts.push([item(extra, { x: left, y: 0, w, enter: up(s.start + 0.9), exit: out(end + 0.08), z: 3 }), 0]);
  stacks.push(parts);
}

/** A centred block: the headline language large, the others under it (opening and end card). */
function centredLines(key, { y, at, exitAt, size = 76, subSize = 52, color }) {
  const parts = [];
  parts.push([item(`<div class="h1" style="${langStyle(PRIMARY, { size, center: true, headline: true })}${color ? `color:${color};` : ''}">${esc(cap(PRIMARY, key))}</div>`,
    { x: W / 2 - 750, y: 0, w: 1500, enter: up(at), exit: exitAt ? out(exitAt) : undefined, z: 3 }), 16]);
  SECONDARY.forEach((lang, i) => {
    parts.push([item(`<div class="sub" style="${langStyle(lang, { size: SECONDARY.length > 1 ? subSize * 0.8 : subSize, center: true })}">${esc(cap(lang, key))}</div>`,
      { x: W / 2 - 750, y: 0, w: 1500, enter: up(at + 0.35 + i * 0.15), exit: exitAt ? out(exitAt + 0.05) : undefined, z: 3 }), 10]);
  });
  stacks.push(Object.assign(parts, { top: y }));
}

/** Stacks each block by its parts' real heights: centred on screen, or from its own `top`. */
function layoutStacks() {
  for (const parts of stacks) {
    const total = parts.reduce((sum, [el, gap], i) => sum + el.offsetHeight + (i < parts.length - 1 ? gap : 0), 0);
    let y = parts.top ?? Math.round((H - total) / 2);
    for (const [el, gap] of parts) {
      el.style.top = y + 'px';
      y += el.offsetHeight + gap;
    }
  }
}

/** One phone. `x` is its left edge in a left-to-right layout; mirrored for a right-to-left one. */
function phone(src, { x, y, at, exitAt, r = 0, cls = '', z = 2, fromX = 160 }) {
  const left = mx(x, PHONE_W);
  return item(`<div class="phone ${cls}"><img src="img/${src}.png"></div>`, { x: left, y, enter: phoneIn(at, fromX, mr(r)), rest: { r: mr(r) }, exit: phoneOut(exitAt), drift: left / 100, z });
}

/**
 * The usual pair of phones: the first screen language in front, the second
 * behind it — or, with one screen language, a second screen of the same
 * game (`alt`) behind it, so a scene never shows the same picture twice.
 */
function phonePair(s, shot, alt, cls = '') {
  const [front, back] = SCREENS;
  phone(back ? `${back}-${shot}` : `${front}-${alt}`, { x: 1060, y: 150, at: s.start + 0.55, exitAt: s.end - 0.5, r: -5, cls, z: 2 });
  phone(`${front}-${shot}`, { x: 1380, y: 110, at: s.start + 0.35, exitAt: s.end - 0.45, r: 3, cls, z: 3 });
}

function squares(s, colors, seed) {
  // The logo's "steam" squares, scattered and drifting.
  const rnd = (n) => { const v = Math.sin(seed * 999 + n * 77.7) * 10000; return v - Math.floor(v); };
  for (let i = 0; i < 9; i++) {
    const size = 14 + rnd(i) * 30, x = rnd(i + 20) * W, y = rnd(i + 40) * H;
    const c = colors[i % colors.length];
    item(`<div style="width:${size}px;height:${size}px;background:${c}"></div>`, {
      x, y, enter: { at: s.start + 0.1 + rnd(i + 60) * 0.6, dur: 0.8, from: { s: 0, o: 0, r: 40 } }, rest: { r: rnd(i + 80) * 40 - 20, o: 0.9 },
      exit: { at: s.end - 0.5, dur: 0.4, to: { s: 0, o: 0 } }, drift: i * 1.7, z: 1,
    });
  }
}

const S = SCREENS[0];

// 1 — opening --------------------------------------------------------------
{
  const s = scene(0, 4.6, 'var(--ground)');
  squares(s, ['#8038D1', '#6FDB55', '#201E1D', '#A473EE'], 1);
  item(`<img src="img/brand-logo.png" style="height:380px;display:block">`, { x: W / 2 - 325, y: 150, enter: { at: 0.15, dur: 1.0, from: { s: 0.55, o: 0, r: -6 }, ease: easeBack }, exit: { at: 4.15, dur: 0.45, to: { s: 1.15, o: 0 } }, z: 3 });
  centredLines('tagline', { y: 600, at: 1.2, exitAt: 4.15 });
}

// 2 — two teams, one screen ------------------------------------------------
{
  const s = scene(4.6, 10.4, 'var(--ground)');
  textBlock(s, 1, 's2');
  phonePair(s, '02-home-player', '01-home-guest');
}

// 3 — set up ---------------------------------------------------------------
{
  const s = scene(10.4, 16.0, 'var(--ground)');
  textBlock(s, 2, 's3');
  phonePair(s, '03-draft', '04-checkout');
}

// 4 — the secret ------------------------------------------------------------
{
  const s = scene(16.0, 22.6, 'var(--purple)');
  squares(s, ['#A473EE', '#591F97', '#6FDB55'], 4);
  textBlock(s, 3, 's4', { light: 'purple' });
  phone(`${S}-05-handoff`, { x: 1020, y: 110, at: s.start + 0.35, exitAt: s.end - 0.45, r: -3, cls: 'onPurple', z: 2 });
  phone(`${S}-06-reveal`, { x: 1400, y: 170, at: s.start + 1.4, exitAt: s.end - 0.5, r: 4, cls: 'onPurple', z: 3, fromX: 260 });
  const label = [PRIMARY, ...SECONDARY.slice(0, 1)]
    .map((lang) => `<span style="${langStyle(lang, { weight: 800 })}">${esc(cap(lang, 's4Label'))}</span>`).join(' · ');
  // Anchored to the screen edge on the phones' side, however long the text.
  item(`<div style="text-align:${RTL ? 'left' : 'right'}"><div class="label" style="display:inline-block">${label}</div></div>`,
    { x: mx(1040, 840), y: 1000, w: 840, enter: { at: s.start + 2.0, dur: 0.6, from: { y: 40, o: 0 } }, rest: { r: mr(-1) }, exit: out(s.end - 0.5), z: 4 });
}

// 5 — act it out -------------------------------------------------------------
{
  const s = scene(22.6, 28.6, 'var(--ink)');
  squares(s, ['#8038D1', '#A473EE', '#6FDB55'], 5);
  textBlock(s, 4, 's5', { light: true });
  phone(`${S}-07-acting`, { x: 1040, y: 150, at: s.start + 0.35, exitAt: s.end - 0.5, r: -4, cls: 'onDark', z: 2 });
  phone(`${SCREENS[1] || S}-08-score-it`, { x: 1400, y: 100, at: s.start + 0.6, exitAt: s.end - 0.45, r: 3, cls: 'onDark', z: 3 });
}

// 6 — got it! ----------------------------------------------------------------
{
  const s = scene(28.6, 34.2, 'var(--green)');
  squares(s, ['#201E1D', '#8038D1', '#FFFFFF'], 6);
  textBlock(s, 5, 's6');
  phonePair(s, '09-recap', '08-score-it');
}

// 7 — win together -----------------------------------------------------------
{
  const s = scene(34.2, 40.0, 'var(--ink)');
  squares(s, ['#6FDB55', '#8038D1', '#A473EE', '#FFFFFF'], 7);
  textBlock(s, 6, 's7', { light: true });
  phonePair(s, '10-final', '09-recap', 'onDark');
}

// 8 — for everyone ---------------------------------------------------------
{
  const s = scene(40.0, 45.6, 'var(--ground)');
  const tags = cap(PRIMARY, 'tags').map((tag, i) => `<span class="${i % 2 ? '' : 'p'}" style="${langStyle(PRIMARY, { weight: 800 })}">${esc(tag)}</span>`).join('');
  textBlock(s, 7, 's8', {
    w: 620, h1Size: 70, subSize: 40,
    extra: `<div class="tags" style="width:620px;justify-content:${RTL ? 'flex-end' : 'flex-start'}">${tags}</div>`,
  });
  const second = SCREENS[1];
  const browser = item(`<div class="browser"><div class="bar"><i></i><i></i><i></i></div><div class="shot"><img src="img/${S}-desktop-home.png">${second ? `<img class="next" src="img/${second}-desktop-home.png" style="opacity:0">` : ''}</div></div>`,
    { x: mx(800, 1040), y: 210, enter: { at: s.start + 0.3, dur: 0.9, from: { x: RTL ? -200 : 200, o: 0, r: mr(3) }, ease: easeBack }, exit: phoneOut(s.end - 0.45), z: 2 });
  // With two screen languages: the same page in the first, then the second.
  if (second) {
    const next = browser.querySelector('.next');
    renderHooks.push((t) => { next.style.opacity = clamp((t - (s.start + 2.7)) / 0.3).toFixed(3); });
  }
}

// 9 — end card: the game, by Perennia -----------------------------------------
{
  const s = scene(45.6, 52, 'var(--ground)');
  squares(s, ['#8038D1', '#6FDB55', '#201E1D', '#A473EE'], 9);
  item(`<img src="img/brand-logo.png" style="height:380px;display:block">`, { x: W / 2 - 325, y: 90, enter: { at: s.start + 0.2, dur: 1.0, from: { s: 0.6, o: 0, r: 5 }, ease: easeBack }, z: 3 });
  centredLines('endLine', { y: 500, at: s.start + 1.0, size: 54, subSize: 44, color: 'var(--ink)' });
  item(`<div style="width:120px;height:6px;background:var(--purple)"></div>`, { x: W / 2 - 60, y: 760, enter: { at: s.start + 1.7, dur: 0.6, from: { s: 0, o: 0 } }, z: 3 });
  item(`<div style="width:900px;${langStyle(PRIMARY, { weight: 800, center: true })}font-size:24px;letter-spacing:${RTL ? 0 : 8}px;color:var(--muted)">${esc(cap(PRIMARY, 'gameBy'))}</div>`, { x: W / 2 - 450, y: 790, enter: up(s.start + 2.0), z: 3 });
  item(`<div style="width:1200px;text-align:center;font-family:Archivo;font-weight:900;font-size:110px;letter-spacing:22px;color:var(--ink)">PERENNIA</div>`, { x: W / 2 - 600, y: 830, enter: { at: s.start + 2.3, dur: 0.9, from: { y: 40, o: 0, s: 0.92 } }, z: 3 });
}

// Fonts not bundled (e.g. Tamil) come from Google Fonts while rendering.
function loadWebFonts() {
  return Promise.all(LANGS.map((lang) => window.LANGUAGES[lang]).filter((L) => L.google).map((L) => new Promise((done) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?family=${L.google}&display=block`;
    link.onload = () => Promise.all([500, 700, 800, 900].map((w) => document.fonts.load(`${w} 40px "${L.font}"`))).then(done, done);
    link.onerror = () => { console.error(`could not load the ${L.name} font`); done(); };
    document.head.appendChild(link);
  })));
}

window.ready = loadWebFonts()
  .then(() => Promise.all([document.fonts.ready, ...[...document.images].map((i) => (i.complete ? null : new Promise((r) => { i.onload = r; i.onerror = r; })))]))
  .then(() => { layoutStacks(); window.render(0); });
window.render(0);
</script>
</body>
</html>
